name: Build Briz King APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o BrizKing_Construction_Record_Keeper_V5_Phone_Build.zip -d android-project
          find android-project -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd android-project/BrizKing_Construction_Record_Keeper_Android
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BrizKing-Construction-Record-Keeper-APK
          path: android-project/BrizKing_Construction_Record_Keeper_Android/app/build/outputs/apk/debug/app-debug.apk
