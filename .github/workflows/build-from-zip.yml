name: Build Briz King APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o BrizKing_Construction_Record_Keeper_V5_Phone_Build.zip -d android-project

      - name: Install image conversion utility
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Briz King Version 11 branding and features
        run: |
          ASSET_DIR=$(find android-project -type d -path "*/app/src/main/assets" -print -quit)
          if [ -z "$ASSET_DIR" ] || [ ! -f "$ASSET_DIR/index.html" ]; then
            echo "Android assets folder or index.html not found"
            exit 1
          fi
          cp masterlist.js "$ASSET_DIR/masterlist.js"
          cp estimate.js "$ASSET_DIR/estimate.js"
          cp masterlist-integration.js "$ASSET_DIR/masterlist-integration.js"
          JAVA_FILE=$(find android-project -type f -path "*/app/src/main/java/com/brizking/constructionrecords/MainActivity.java" -print -quit)
          if [ -z "$JAVA_FILE" ]; then echo "MainActivity.java not found"; exit 1; fi
          cp v8/MainActivity.java "$JAVA_FILE"
          # Keep Estimate Desk separate; integrate Master Lists into existing Record Keeper forms.
          cat > "$ASSET_DIR/print-bridge.js" <<'EOF'
          window.print = function () {
            if (window.BrizKingNative && window.BrizKingNative.printHtml) {
              window.BrizKingNative.printHtml(document.documentElement.outerHTML, document.title || "BrizKing-Project-Sheet");
            } else {
              alert("PDF printing is available in the installed Briz King app.");
            }
          };
          EOF
          sed -i 's#</body>#<script src="masterlist.js"></script>\n<script src="estimate.js"></script>\n<script src="masterlist-integration.js"></script>\n<script src="print-bridge.js"></script>\n</body>#' "$ASSET_DIR/index.html"
          echo "V11 native PDF print bridge, Android share chooser, Master List integration and separate Estimate Desk installed"
          # Apply the supplied Briz King Concept logo to all Android launcher icon densities.
          GRADLE_FILE=$(find android-project -type f \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) -print -quit)
          if [ -z "$GRADLE_FILE" ]; then echo "App Gradle file not found"; exit 1; fi
          APP_DIR=$(dirname "$GRADLE_FILE")
          RES_DIR="$APP_DIR/src/main/res"
          mkdir -p "$RES_DIR"
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES_DIR/mipmap-$density"
            convert brizking-icon.jpg -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$RES_DIR/mipmap-$density/ic_launcher.png"
            cp "$RES_DIR/mipmap-$density/ic_launcher.png" "$RES_DIR/mipmap-$density/ic_launcher_round.png"
          done
          # Increment the Android version for the next install.
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          sed -i 's#<application#<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 11/; s/versionCode[[:space:]]+[0-9]+/versionCode 11/' "$GRADLE_FILE"
          sed -i -E 's/versionName[[:space:]]*=[[:space:]]*"[^"]+"/versionName = "11.0"/; s/versionName[[:space:]]+"[^"]+"/versionName "11.0"/' "$GRADLE_FILE"
          echo "Briz King Version 11 logo and version applied"

      - name: Locate and Build Android Project
        run: |
          SETTINGS_FILE=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BrizKing-Construction-Record-Keeper-V11-APK
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
