
name: Build Briz King APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o BrizKing_Construction_Record_Keeper_V5_Phone_Build.zip -d android-project

      - name: Install V6 Master Lists
        run: |
          ASSET_DIR=$(find android-project -type d -path "*/app/src/main/assets" -print -quit)
          if [ -z "$ASSET_DIR" ] || [ ! -f "$ASSET_DIR/index.html" ]; then
            echo "Android assets folder or index.html not found"
            exit 1
          fi
          cp masterlist.js "$ASSET_DIR/masterlist.js"
          if ! grep -q 'masterlist.js' "$ASSET_DIR/index.html"; then
            sed -i 's#</body>#<script src="masterlist.js"></script>\n</body>#' "$ASSET_DIR/index.html"
          fi
          echo "V6 Master Lists installed in Android assets"
          
      - name: Locate and Build Android Project
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")

          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BrizKing-Construction-Record-Keeper-APK
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
